# Setiap push tag "v*" (mis. v1.1.0) → build Windows → buat Release berisi zip.
name: Release Windows
on:
  push:
    tags: ['v1.0.1']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "KatalogImportbox-${{ github.ref_name }}-windows.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: KatalogImportbox-*-windows.zip
          generate_release_notes: true
