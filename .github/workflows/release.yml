# Setiap push tag "v*" (mis. v1.1.0) → build Windows → buat Release berisi zip.
name: Release Windows
on:
  push:
    tags: ['v1.1.0']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Versi diambil dari tag (v1.2.0 -> 1.2.0) dan ditulis ke kAppVersion,
      # sehingga nomor versi di aplikasi pasti sama dengan tag rilis.
      - name: Set versi dari tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content lib/update.dart) -replace "const kAppVersion = '[^']*';", "const kAppVersion = '$v';" | Set-Content lib/update.dart
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: flutter build windows --release --build-name=$env:VERSION
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "KatalogImportbox-${{ github.ref_name }}-windows.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: KatalogImportbox-*-windows.zip
          generate_release_notes: true
